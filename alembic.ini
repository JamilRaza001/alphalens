# AlphaLens v8 — Alembic configuration.
#
# The database URL is NOT stored here. env.py reads NEON_DIRECT_URL from the
# environment / .env (L12: Direct URL for migrations, never the pooled app URL).

[alembic]
script_location = alembic
prepend_sys_path = .
# Use a timezone-aware UTC timestamp if/when autogenerating revision filenames.
timezone = UTC
# We hand-write revisions (explicit op.execute DDL); no autogenerate.

[post_write_hooks]
# none

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
